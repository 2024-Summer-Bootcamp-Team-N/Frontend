services:
  frontend:
    container_name: frontend
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    volumes:
      - .:/frontend/
      - /frontend/node_modules
    networks:
      - app-network
    tty: true
    stdin_open: true

networks:
  app-network:
    driver: bridge